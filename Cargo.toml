[package]
name = "k-center"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_k_center"
crate-type = ["cdylib"]

[dependencies]
distances = "1.8.0"
ndarray = "0.17.2"
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
rand = "0.10.2"
rand_pcg = "0.10.2"
