[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "k-center"
description = "Rust-accelerated implementations of the k-center (and k-supplier) problem."
authors = [
    { name = "Sophia Voelker", email = "sophia.voelker@hhu.de"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
    "scikit-learn>=1.3.2",
]

[project.urls]
Homepage = "https://clustering-toolkit.algo.hhu.de/K-Center_Clustering"
Repository = "https://github.com/algo-hhu/k-center"

[tool.maturin]
python-source = "python"
module-name = "k_center._k_center"

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "mypy==1.10.0",
    "flake8==7.0.0",
    "flake8-bugbear==21.4.3",
]
